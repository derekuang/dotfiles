# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: low
# Copied from the dsh-tui profile: Anysearch MCP server (Streamable HTTP).
# The bearer token is read at load time from ~/.secrets/anysearch.
- insert:
    - id: mcp-anysearch
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: anysearch
        url: https://api.anysearch.com/mcp
        headers:
          Authorization: !!js "`Bearer
            ${process.getBuiltinModule('node:fs').readFileSync(process.env.HOME
            + '/.secrets/anysearch', 'utf8').trim()}`"
          X-Anysearch-Client: mcp/1.0.0
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
